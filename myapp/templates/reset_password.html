{% extends "parent.html" %}

{% block main %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold" style="color: var(--text-primary); letter-spacing: -0.03em;">Reset Password</h2>
      <p class="text-muted">Enter your registered email to reset your password</p>
    </div>

    <div class="saas-card shadow-lg p-4 p-md-5 border-0">
      <form method="post">
        {% csrf_token %}

        {% if messages %}
          {% for m in messages %}
            <div class="alert alert-{{ m.tags }} alert-dismissible fade show text-sm py-2 px-3 rounded" role="alert">
              {{ m }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}

        <div class="mb-4">
          <label class="saas-form-label">Registered Email</label>
          <input type="email" name="email" class="saas-form-control" value="{{ email|default:'' }}" placeholder="Enter your registered email" required autofocus>
        </div>

        <div class="mb-4">
          <label class="saas-form-label">New Password</label>
          <input type="password" name="password" class="saas-form-control" placeholder="Enter new password" required>
        </div>

        <div class="mb-4">
          <label class="saas-form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="saas-form-control" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn-saas-primary w-100 py-2 mt-2" style="font-size: 1rem;">Reset Password</button>
      </form>
    </div>

    <p class="text-center mt-4 text-muted" style="font-size: 0.875rem;">
      Remember your password? <a href="{% url 'login' %}" class="fw-medium">Back to Login</a>
    </p>
  </div>
</div>
{% endblock main %}
